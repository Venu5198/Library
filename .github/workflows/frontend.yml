name: Frontend SPA Pipeline (React 18)

on:
  push:
    paths:
      - "frontend/**"
    branches: [main]
    tags:
      - "frontend-v*"
  pull_request:
    paths:
      - "frontend/**"
    branches: [main]

jobs:
  test-and-build:
    name: Test & Build Frontend
    runs-on: ubuntu-latest

    services:
      verdaccio:
        image: verdaccio/verdaccio:5
        ports:
          - 4873:4873

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            ui-library/package-lock.json
            frontend/package-lock.json

      - name: Start & Publish UI Library to CI Verdaccio
        run: |
          echo "Waiting for CI Verdaccio..."
          for i in {1..15}; do
            if curl -s http://127.0.0.1:4873/-/ping > /dev/null; then
              echo "✓ Verdaccio is online."
              break
            fi
            sleep 2
          done

          cd ui-library
          npm ci
          node ../infrastructure/scripts/publish-ui.js 0.1.0

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm install || (cat /home/runner/.npm/_logs/*-debug-0.log | tail -n 100 && exit 1)

      - name: Run Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Check Formatting
        working-directory: frontend
        run: npm run format:check

      - name: Run Vitest Unit Tests
        working-directory: frontend
        run: npm test

      - name: Build Production Bundle
        working-directory: frontend
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  docker-build:
    name: Build & Publish Container Image
    needs: test-and-build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Pre-built Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Fallback to GitHub Container Registry (ghcr.io)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-cloud-run:
    name: Deploy to Google Cloud Run
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check GCP Deployment Configuration
        id: check_gcp
        run: |
          if [ -n "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "GCP_PROJECT_ID secret not configured. Skipping Cloud Run deployment."
          fi

      - name: Authenticate to Google Cloud
        if: steps.check_gcp.outputs.enabled == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run (Blue-Green Revision)
        if: steps.check_gcp.outputs.enabled == 'true'
        run: |
          gcloud run deploy frontend \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --image=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/app-containers/frontend:${{ github.sha }} \
            --region=${{ secrets.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=80
