name: Frontend SPA Pipeline (React 18)

on:
  push:
    paths:
      - "frontend/**"
    branches: [main]
    tags:
      - "frontend-v*"
  pull_request:
    paths:
      - "frontend/**"
    branches: [main]

jobs:
  test-and-build:
    name: Test & Build Frontend
    runs-on: ubuntu-latest

    services:
      verdaccio:
        image: verdaccio/verdaccio:5
        ports:
          - 4873:4873

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            ui-library/package-lock.json
            frontend/package-lock.json

      - name: Start & Publish UI Library to CI Verdaccio
        run: |
          for i in {1..15}; do
            if curl -s http://localhost:4873/-/ping > /dev/null; then
              break
            fi
            sleep 2
          done
          cd ui-library
          npm ci
          node ../infrastructure/scripts/publish-ui.js 0.1.0

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Check Formatting
        working-directory: frontend
        run: npm run format:check

      - name: Run Vitest Unit Tests
        working-directory: frontend
        run: npm test

      - name: Build Production Bundle
        working-directory: frontend
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  docker-build:
    name: Build & Publish Container Image
    needs: test-and-build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Pre-built Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud (Workload Identity)
        if: env.GCP_PROJECT_ID != ''
        uses: google-github-actions/auth@v2
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Google Artifact Registry
        if: env.GCP_PROJECT_ID != ''
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      # Fallback to GitHub Container Registry (ghcr.io) if GCP secrets not yet set
      - name: Log in to GitHub Container Registry
        if: env.GCP_PROJECT_ID == ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-cloud-run:
    name: Deploy to Google Cloud Run
    needs: docker-build
    if: github.ref == 'refs/heads/main' && env.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run (Blue-Green Revision)
        run: |
          gcloud run deploy frontend \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --image=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/app-containers/frontend:${{ github.sha }} \
            --region=${{ secrets.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=80
