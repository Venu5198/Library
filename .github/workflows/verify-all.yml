name: Platform Verification Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-workspace:
    name: Full Platform Verification
    runs-on: ubuntu-latest

    services:
      verdaccio:
        image: verdaccio/verdaccio:5
        ports:
          - 4873:4873

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            ui-library/package-lock.json
            frontend/package-lock.json

      - name: Setup Python Runtime (for FastAPI Backend)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Backend Dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Wait for Verdaccio Service & Publish Initial UI Library Versions
        run: |
          echo "Checking Verdaccio availability on 127.0.0.1:4873..."
          for i in {1..15}; do
            if curl -s http://127.0.0.1:4873/-/ping > /dev/null; then
              echo "✓ Verdaccio is online."
              break
            fi
            echo "Waiting for Verdaccio..."
            sleep 2
          done

          # Install UI library dependencies and publish versions 0.1.0 & 0.2.0 to CI Verdaccio
          cd ui-library
          npm ci --include=dev
          node ../infrastructure/scripts/publish-ui.js 0.1.0
          node ../infrastructure/scripts/publish-ui.js 0.2.0

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm install --include=dev || (cat /home/runner/.npm/_logs/*-debug-0.log | tail -n 100 && exit 1)

      - name: Run Cross-Platform Verification Script
        run: |
          node infrastructure/scripts/verify-all.js
