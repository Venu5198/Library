name: Platform Verification Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-workspace:
    name: Full Platform Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Start Verdaccio Registry Container
        run: |
          docker run -d \
            --name verdaccio \
            --user root \
            -p 4873:4873 \
            -v ${{ github.workspace }}/infrastructure/verdaccio/config.yaml:/verdaccio/conf/config.yaml \
            verdaccio/verdaccio:5

          echo "Waiting for Verdaccio to be ready..."
          for i in {1..20}; do
            if curl -s http://127.0.0.1:4873/-/ping > /dev/null; then
              echo "✓ Verdaccio is online with custom config."
              break
            fi
            sleep 1
          done

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            ui-library/package-lock.json
            frontend/package-lock.json

      - name: Setup Python Runtime (for FastAPI Backend)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Backend Dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Publish Initial UI Library Versions to Local Verdaccio
        run: |
          npm config set //127.0.0.1:4873/:_authToken fake-token

          cd ui-library
          npm ci --include=dev
          (node ../infrastructure/scripts/publish-ui.js 0.1.0 && node ../infrastructure/scripts/publish-ui.js 0.2.0) 2>&1 | tee /tmp/publish.log || {
            echo "### Publish to Verdaccio Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/publish.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "### Verdaccio Docker Logs" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            docker logs verdaccio >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm install --include=dev 2>&1 | tee /tmp/frontend-install.log || {
            echo "### npm install in frontend Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/frontend-install.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Run Cross-Platform Verification Script
        run: |
          node infrastructure/scripts/verify-all.js
